version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: roombae-backend-dev
    env_file:
      - ./backend/.env.development
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - roombae-dev-network
    restart: unless-stopped

networks:
  roombae-dev-network:
    name: roombae-dev-network
    driver: bridge
