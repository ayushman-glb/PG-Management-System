name: RoomBae Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: White-Box Testing & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Prisma Client Generation
        run: |
          cd backend
          npx prisma generate

      - name: Type Check Backend & Frontend
        run: |
          cd backend && npx tsc --noEmit
          cd ../frontend && npm ci && npx tsc --noEmit

      - name: Run Automated API Tests
        run: |
          cd backend
          npm test

  build-and-deploy:
    name: Build Container & Deploy to K8s Cluster
    needs: audit-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

      - name: Deploy to Kubernetes Cluster
        run: |
          echo "Applying Kubernetes manifests to production cluster..."
          # kubectl apply -f k8s/deployment.yaml
