version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roombae-frontend
    ports:
      - "80:80"
    networks:
      - roombae-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roombae-backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-mongodb://roombae-mongo:27017/roombae-db?replicaSet=rs0}
      - REDIS_HOST=roombae-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Rdb@RoomBae_dev94a7e2b1c8f5}
      - REDIS_URL=${REDIS_URL:-redis://:Rdb@RoomBae_dev94a7e2b1c8f5@roombae-redis:6379/0}
      - REDIS_DB=0
      - REDIS_TLS=false
      - CACHE_TTL=3600
      - SESSION_TTL=86400
    networks:
      - roombae-network
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: roombae-redis
    hostname: redis
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-Rdb@RoomBae_dev94a7e2b1c8f5}
    ports:
      - "6379:6379"
    networks:
      - roombae-network
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-Rdb@RoomBae_dev94a7e2b1c8f5} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: roombae-mongo
    hostname: mongo
    ports:
      - "27017:27017"
    networks:
      - roombae-network
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongod --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

networks:
  roombae-network:
    name: roombae-network
    driver: bridge

volumes:
  redis-data:
    name: roombae-redis-data
  mongo-data:
    name: roombae-mongo-data
