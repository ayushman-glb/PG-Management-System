version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: roombae-loadbalancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    restart: always

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roombae-backend-node-1
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLUSTER_MODE=true
      - DATABASE_URL=mongodb://mongo:27017/roombae-db?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: always

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roombae-backend-node-2
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLUSTER_MODE=true
      - DATABASE_URL=mongodb://mongo:27017/roombae-db?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: roombae-redis-cluster
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass roombaepass
    volumes:
      - redis-data:/data
    restart: always

  mongo:
    image: mongo:7.0
    container_name: roombae-mongodb-rs
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  redis-data:
  mongo-data:
